name: Refresh Briefly articles

# Vercel Hobby's own Cron Jobs are capped at once per day, which is far
# too slow for a news site. This workflow is the external scheduler that
# actually drives the ~10-minute refresh cadence instead — it's free on
# GitHub, needs no server of its own, and just calls the deployed
# /api/cron/refresh route.
#
# HONEST CAVEAT: GitHub Actions' `schedule` trigger is best-effort, not
# exact — during high platform load, runs can be delayed by several
# minutes (rarely more). That's fine here: a refresh that's a few minutes
# late just means the snapshot is a few minutes staler, never a broken
# site (see lib/data.ts's "never replace with empty/partial" rule). Also
# note GitHub disables scheduled workflows automatically after 60 days
# with no commits to the repo — push something (even a trivial change)
# periodically, or re-enable it manually from the Actions tab, to keep it
# running on an otherwise-quiet repo.
#
# SETUP:
#   1. In your GitHub repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret. Add:
#        BRIEFLY_SITE_URL   e.g. https://briefly.news (no trailing slash)
#        CRON_SECRET        the same value you set in Vercel's env vars
#   2. That's it — this workflow starts running on the schedule below.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/refresh
        run: |
          curl -sS -f -X GET "${{ secrets.BRIEFLY_SITE_URL }}/api/cron/refresh" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 65
